name: iOS

# 出的是**未签名**的 ipa：Windows 上没法签名，也不需要——签名是安装那一步的事。
# 下载后用 Sideloadly / AltStore / SideStore 用自己的 Apple ID 重签即可；
# 免费账号 7 天过期，付费开发者账号 1 年。
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 选最新 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "用 $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: 装依赖
        run: npm ci

      - name: 类型与 lint 闸门
        run: |
          npx tsc --noEmit
          npx eslint src

      # 三道纯逻辑闸门不依赖 Xcode，先跑：模型没导出好就不该浪费 20 分钟编译
      - name: 推理 / 栅格化 / 状态机闸门
        run: |
          node tools/check-raster.mjs
          node tools/check-engine.mjs
          node tools/check-game.mjs

      # Expo 用 CNG（Continuous Native Generation）：仓库里没有 ios/，
      # 每次都由 app.json + config plugin 现场生成，改配置不用手改工程文件。
      - name: 生成 ios 工程
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 装 Pods
        run: npx pod-install ios

      - name: 版本号对齐 tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd ios
          agvtool new-marketing-version "$v"
          agvtool new-version -all "$(git rev-list --count HEAD)"

      - name: 编译未签名 ipa
        run: |
          set -euo pipefail
          cd ios
          workspace=$(ls *.xcworkspace | head -1)
          # 不能拿 workspace 名去掉后缀当 scheme：Expo prebuild 生成的 scheme
          # 是 app 的 displayName，和 workspace 目录名不一定一致（中文名、空格都会出问题）。
          # 从 xcodebuild 自己吐的清单里取第一个 scheme 才靠得住。
          scheme=$(xcodebuild -list -json -workspace "$workspace" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          echo "workspace=$workspace scheme=$scheme"
          test -n "$scheme"

          # 三件事同时做：
          # 1. 关掉一切签名（CODE_SIGNING_ALLOWED=NO 是唯一真正管用的那个）
          # 2. -file-prefix-map / -ffile-prefix-map 把构建机的家目录从调试信息里抹掉，
          #    否则包里会留下 /Users/runner/work/... 这样的路径
          # 3. 显式指定 generic/platform=iOS，不然会挑模拟器架构，产物装不上真机
          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            OTHER_SWIFT_FLAGS="-file-prefix-map=$PWD=/DoodleMind" \
            OTHER_CFLAGS="-ffile-prefix-map=$PWD=/DoodleMind" \
            > xcodebuild.log 2>&1 || true

          # 先打一遍摘要，再判定。xz 日志几千行全吐出来会把 CI 页面刷爆
          grep -E 'error:|BUILD ' xcodebuild.log | tail -40 || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log || { echo "编译失败，末尾日志："; tail -80 xcodebuild.log; exit 1; }

          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "产物 $app"
          test -d "$app"

          # 去掉签名残留与调试符号里的绝对路径。
          # strip 要作用在**可执行文件**上：直接对 .app 目录调会被当成打不开的文件，
          # 静默失败（所以以前那行 `|| true` 其实什么都没剥）。
          rm -rf "$app/_CodeSignature"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          xcrun strip -S -x "$app/$exe"
          find "$app" -name '*.dSYM' -prune -exec rm -rf {} + 2>/dev/null || true

          rm -rf Payload DoodleMind-unsigned.ipa
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry DoodleMind-unsigned.ipa Payload
          ls -lh DoodleMind-unsigned.ipa

      - name: 校验 ipa 结构
        run: |
          set -euo pipefail
          cd ios
          # 注意不要写成 `unzip -l ... | head -20`：head 提前关管道会给 unzip 发
          # SIGPIPE，在 `set -o pipefail` 下这一步直接判失败。先落文件再截取。
          unzip -l DoodleMind-unsigned.ipa > ipa-list.txt
          sed -n '1,15p' ipa-list.txt
          rm -rf check
          unzip -q DoodleMind-unsigned.ipa -d check
          appdir=$(find check/Payload -maxdepth 1 -name '*.app' | head -1)
          test -n "$appdir" || { echo "没有 Payload/*.app"; exit 1; }
          # 未签名包不该带 _CodeSignature
          if find check -name '_CodeSignature' | grep -q .; then echo "残留签名目录"; exit 1; fi
          plutil -p "$appdir/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion'
          # 包内不能出现构建机的绝对路径
          if grep -rq "/Users/runner" check/Payload 2>/dev/null; then echo "包里泄漏了构建机路径"; exit 1; fi
          echo "结构校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: DoodleMind-unsigned-ipa
          path: ios/DoodleMind-unsigned.ipa
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/DoodleMind-unsigned.ipa
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            未签名 ipa，用 Sideloadly / AltStore / SideStore 自签安装，详见 README 的「装到 iPhone 上」。
