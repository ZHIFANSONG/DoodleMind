name: iOS

# 出的是**未签名**的 ipa：Windows 上没法签名，也不需要——签名是安装那一步的事。
# 下载后用 Sideloadly / AltStore / SideStore 用自己的 Apple ID 重签即可；
# 免费账号 7 天过期，付费开发者账号 1 年。
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# 默认的 GITHUB_TOKEN 只有读权限，发布 Release 需要显式的 contents: write，
# 否则最后一步报 "Resource not accessible by integration"（踩过一次：
# 编译、校验、上传 artifact 全过，只在发 Release 时 403）。
permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 不取"最新的 Xcode"。Xcode 26.3 的 Swift 把 expo-modules-jsi 里一处
      # SE-0414 区域隔离诊断（sending 'slot' risks causing data races）
      # 从警告收紧成了 error。
      #
      # 关键在于：那个文件不是我们的 target 编的。ExpoModulesJSI.podspec 里有个
      # script phase 跑 apple/scripts/build-xcframework.sh，它用 `env -i` 另起一个
      # xcodebuild 编自己的 SPM 包 —— 外层命令行传的 SWIFT_VERSION /
      # SWIFT_STRICT_CONCURRENCY 一律进不去（env -i 就是清环境）。
      # 所以只能从工具链这一层避开：优先用较低的 26.x。
      - name: 选 Xcode
        run: |
          set -euo pipefail
          echo "可用的 Xcode："
          ls -d /Applications/Xcode*.app || true
          pick=""
          for v in 26.0.0 26.0.1 26.1.0 26.1.1 26.2.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then pick="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$pick" ]; then
            # 兜底：取最旧的稳定版（排除 beta / release candidate）
            pick=$(ls -d /Applications/Xcode*.app | grep -vi -e beta -e rc | sort -V | head -1)
          fi
          echo "用 $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version

      - name: 装依赖
        run: npm ci

      # 必须在 pod install 之前打。expo-modules-jsi 有一行在 Xcode 26 的 Swift 6
      # 语言模式下被判 SE-0414 区域隔离 error（sending 'slot' risks causing data
      # races），而那是 Pods 的 script phase 用 `env -i` 另起 xcodebuild 编的，
      # 外层命令行传 SWIFT_VERSION 无效。详见 scripts/patch-expo-jsi.mjs 的注释。
      - name: 修 expo-modules-jsi 的 SE-0414 误报
        run: node scripts/patch-expo-jsi.mjs

      - name: 类型与 lint 闸门
        run: |
          npx tsc --noEmit
          npx eslint src

      # 四道纯逻辑闸门不依赖 Xcode，先跑：模型没导出好就不该浪费 20 分钟编译
      - name: 推理 / 栅格化 / 梯度 / 状态机闸门
        run: |
          node tools/check-raster.mjs
          node tools/check-engine.mjs
          node tools/check-grad.mjs
          node tools/check-game.mjs

      # Expo 用 CNG（Continuous Native Generation）：仓库里没有 ios/，
      # 每次都由 app.json + config plugin 现场生成，改配置不用手改工程文件。
      - name: 生成 ios 工程
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 装 Pods
        run: npx pod-install ios

      - name: 版本号对齐 tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd ios
          agvtool new-marketing-version "$v"
          agvtool new-version -all "$(git rev-list --count HEAD)"

      # 编译逻辑在 scripts/build-ipa.sh 里，不写在 workflow 里：
      # 这段反复出问题（scheme 取法、strip 作用对象、管道 SIGPIPE），
      # 放在文件里能本地对着看、在日志里逐行定位，而不是每次改完 push 一次等排队。
      - name: 编译未签名 ipa
        run: bash scripts/build-ipa.sh

      - name: 校验 ipa 结构
        run: |
          set -euo pipefail
          cd ios
          # 注意不要写 `unzip -l ... | head -20`：head 读完就关管道，unzip 收
          # SIGPIPE，在 `set -o pipefail` 下这一步直接判失败。重定向到文件再截取。
          unzip -l DoodleMind-unsigned.ipa > ipa-list.txt
          sed -n '1,15p' ipa-list.txt
          rm -rf check
          unzip -q DoodleMind-unsigned.ipa -d check
          appdir=$(find check/Payload -maxdepth 1 -name '*.app' | head -1)
          test -n "$appdir" || { echo "没有 Payload/*.app"; exit 1; }
          if find check -name '_CodeSignature' | grep -q .; then
            echo "残留签名目录"; exit 1
          fi
          plutil -p "$appdir/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion'

          # 这条检查比任何"好看"的检查都重要。
          #
          # release 的 main.jsbundle 是 Hermes 字节码，偏移 32 处是一个 u32
          # 写着**文件自身的长度**。我曾在 bundle 上做字节替换去抹构建机路径
          # （纯文本替换，看起来完全无害），结果把字符串表弄坏了：文件少了
          # 29 字节，头里仍写着旧长度，App 装到手机上启动即闪退——而 unzip、
          # plutil、grep 这些静态检查全绿。所以必须验"头里声明的长度 == 实际长度"。
          python3 - "$appdir/main.jsbundle" <<'PY'
          import struct, sys
          p = sys.argv[1]
          d = open(p, 'rb').read()
          magic = struct.unpack_from('<I', d, 0)[0]
          if magic != 0x03BC1FC6:
              sys.exit(f"main.jsbundle 不是 Hermes 字节码（magic={magic:08x}）")
          ver = struct.unpack_from('<I', d, 8)[0]
          declared = struct.unpack_from('<I', d, 32)[0]
          print(f"main.jsbundle: Hermes v{ver}, 头声明 {declared} 字节, 实际 {len(d)} 字节")
          if declared != len(d):
              sys.exit(f"bundle 已损坏：头里 {declared} 与实际 {len(d)} 差 {declared - len(d)} 字节")
          PY

          # 构建机路径只当信息看。main.jsbundle 是**二进制**，一个字节都改不得；
          # 而 hermes / React / ReactNativeDependencies / ExpoModulesJSI 这些
          # 第三方预编译产物自带路径，本工程改不掉。它们都只是 /Users/runner
          # 这类 CI 临时目录，不含任何个人信息。
          echo "── 以下文件含构建机路径（仅 CI 目录，不影响安装）──"
          { grep -rl "/Users/runner" check/Payload 2>/dev/null || true; } | sed -n '1,20p'
          echo "结构校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: DoodleMind-unsigned-ipa
          path: ios/DoodleMind-unsigned.ipa
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/DoodleMind-unsigned.ipa
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            未签名 ipa，用 Sideloadly / AltStore / SideStore 自签安装，详见 README 的「装到 iPhone 上」。
